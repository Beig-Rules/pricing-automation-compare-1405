<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقایسه قیمت اتوماسیون بازاریابی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#F4F4F2;--s:#fff;--t:#0A0A0A;--m:#6B6B6B;--st:#E2E2E0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",sans-serif;background:var(--bg);color:var(--t);padding:40px 20px}.c{max-width:900px;margin:0 auto}h1{font-size:2.2rem;margin-bottom:24px;text-align:center}table{width:100%;border-collapse:collapse;background:var(--s);margin-top:32px}th,td{border:1px solid var(--st);padding:16px;text-align:center}th{background:#0A0A0A;color:#F4F4F2}</style></head><body><div class="c"><h1>مقایسه ساده ابزارهای اتوماسیون بازاریابی</h1><p style="text-align:center;color:var(--m)">برای تیم‌های ایرانی — قیمت‌ها تقریبی هستند</p><table><tr><th>ابزار</th><th>شروع</th><th>حرفه‌ای</th><th>ویژگی برتر</th></tr><tr><td>ابزار الف</td><td>رایگان</td><td>۲۹۰ هزار</td><td>اتوماسیون ایمیل</td></tr><tr><td>ابزار ب</td><td>۹۹ هزار</td><td>۴۹۰ هزار</td><td>ادغام با اینستاگرام</td></tr><tr><td>ابزار ج</td><td>۱۴۹ هزار</td><td>۷۹۰ هزار</td><td>هوش مصنوعی تولید محتوا</td></tr></table></div></body></html>
